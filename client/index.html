<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/turnsout.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <script>
            (function () {
                try {
                    const theme =
                        localStorage.getItem("echo-theme") || "system";
                    const root = document.documentElement;
                    root.classList.remove("light", "dark");
                    if (theme === "system") {
                        const systemTheme = window.matchMedia(
                            "(prefers-color-scheme: dark)",
                        ).matches
                            ? "dark"
                            : "light";
                        root.classList.add(systemTheme);
                    } else {
                        root.classList.add(theme);
                    }
                } catch (e) {
                    console.error(e);
                }
            })();
        </script>
        <script>
            (function () {
                try {
                    var accent = localStorage.getItem("turnsout_accent");
                    if (
                        accent &&
                        ["orange", "blue", "violet", "rose", "green"].indexOf(
                            accent,
                        ) !== -1
                    ) {
                        document.documentElement.setAttribute(
                            "data-accent",
                            accent,
                        );
                    }
                } catch (e) {
                    console.error(e);
                }
            })();
        </script>

        <!-- Primary Meta Tags -->
        <title>TurnsOut</title>
        <meta name="title" content="TurnsOut" />
        <meta
            name="description"
            content="TurnsOut is an open community platform where you can ask questions, share knowledge, and connect with communities through chambers."
        />
        <meta
            name="keywords"
            content="QnA, questions, answers, community, forum, turnsout, discussion"
        />
        <meta name="author" content="Ayush Pandey" />
        <meta name="theme-color" content="#171717" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://turnsout.xyz/" />
        <meta property="og:title" content="TurnsOut" />
        <meta
            property="og:description"
            content="TurnsOut is an open community platform where you can ask questions, share knowledge, and connect with communities through chambers."
        />
        <meta property="og:image" content="https://turnsout.xyz/thumb.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:site_name" content="TurnsOut" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://turnsout.xyz/" />
        <meta property="twitter:title" content="TurnsOut" />
        <meta
            property="twitter:description"
            content="TurnsOut is an open community platform where you can ask questions, share knowledge, and connect with communities through chambers."
        />
        <meta
            property="twitter:image"
            content="https://turnsout.xyz/thumb.jpg"
        />

        <!-- Apple / PWA -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="TurnsOut" />
        <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
